<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Schulte — BrainArena</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- App CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="bg-main text-white">
    <!-- US-02: Luyện tập Bảng Schulte theo cấp độ tăng dần -->
    <div class="app-layout">
        <div id="global-header-placeholder"></div>

        <div class="app-body">
            <div id="desktop-sidebar-placeholder"></div>

            <main class="main-viewport">
                <div class="content-container">
                    <!-- Top Game Bar -->
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <div class="d-flex align-items-center gap-2">
                            <a href="challenges.html" class="btn btn-sm btn-icon-glass" title="Quay lại"><i class="bi bi-arrow-left"></i></a>
                            <div>
                                <h5 class="mb-0 fw-bold">Bảng Schulte</h5>
                                <span class="badge bg-primary text-xxs" id="game-level-indicator">Level 2 • Lưới 4x4</span>
                            </div>
                        </div>

                        <!-- Digital Timer -->
                        <div class="timer-badge" id="schulte-timer">0.00s</div>
                    </div>

                    <!-- Target & Progress Panel -->
                    <div class="stat-card mb-3 d-flex align-items-center justify-content-between">
                        <div>
                            <span class="text-xxs text-white-50 text-uppercase fw-bold">Mục tiêu tiếp theo</span>
                            <div class="fs-3 fw-bold text-cyan" id="schulte-target">1</div>
                        </div>

                        <!-- Mistake Penalty Indicator per US-02 -->
                        <div id="penalty-indicator" class="badge bg-danger text-white text-xs px-3 py-2 d-none pulse-glow">
                            +1.0s Phạt!
                        </div>

                        <div class="text-end" style="min-width: 120px;">
                            <div class="d-flex justify-content-between text-xxs text-white-50 mb-1">
                                <span>Tiến độ</span>
                                <span id="schulte-progress-text">0/16</span>
                            </div>
                            <div class="progress-esports">
                                <div class="progress-bar progress-bar-cyan" id="schulte-progress-bar" style="width: 0%;"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Schulte Game Container -->
                    <div class="schulte-container mb-3" id="schulte-board-container">
                        <div id="schulte-grid" class="schulte-grid schulte-grid-4x4">
                            <!-- Dynamic Numbers Inserted Here by schulte.js -->
                        </div>
                    </div>

                    <!-- Interactive Skill Testing Bar for Solo Practice -->
                    <div class="d-flex justify-content-between align-items-center p-2 rounded-3 bg-dark border border-secondary border-opacity-25">
                        <span class="text-xxs text-white-50"><i class="bi bi-lightbulb text-amber me-1"></i>Bấm đúng số từ bé đến lớn để hoàn thành. Bấm sai bị phạt +1 giây.</span>
                        <button class="btn btn-sm btn-glass text-xs" onclick="if(window.currentGame) window.currentGame.applyHint();" title="Thử kỹ năng gợi ý">
                            <i class="bi bi-magic text-cyan me-1"></i> Dùng Gợi Ý
                        </button>
                    </div>
                </div>
            </main>
        </div>

        <div id="mobile-bottom-nav-placeholder"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/schulte.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const level = parseInt(urlParams.get('level')) || 1;

            const indicator = document.getElementById('game-level-indicator');
            if (indicator) {
                const sizeText = level === 1 ? '3x3 (1–9)' : (level === 2 ? '4x4 (1–16)' : '5x5 (1–25)');
                indicator.textContent = `Level ${level} • Lưới ${sizeText}`;
            }

            // Instantiate Schulte game
            window.currentGame = new SchulteGame();
            window.currentGame.init(level, 'solo');
        });
    </script>
</body>
</html>
