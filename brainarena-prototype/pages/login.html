<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — BrainArena</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- App CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="bg-main text-white d-flex align-items-center justify-content-center min-vh-100 p-3">
    <!-- US-01: Đăng ký và Đăng nhập định danh -->
    <div class="card-esports p-4 p-md-5 max-w-md w-100 shadow-neon border-primary border-opacity-30" style="max-width: 440px;">
        <div class="text-center mb-4">
            <div class="brand-logo-badge mx-auto mb-3" style="width: 56px; height: 56px;">
                <i class="bi bi-cpu-fill text-cyan fs-2"></i>
            </div>
            <h2 class="brand-title fs-3 mb-1">BRAIN<span class="text-gradient-cyan">ARENA</span></h2>
            <p class="text-xs text-white-50">Rèn luyện trí tuệ • Đấu 1v1 Real-time • Dùng kỹ năng</p>
        </div>

        <!-- Login form mock -->
        <div class="mb-3">
            <label class="form-label text-xs text-white-70 fw-bold">Email</label>
            <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-white-50"><i class="bi bi-envelope"></i></span>
                <input type="email" id="input-email" class="form-control bg-dark border-secondary text-white" value="player@brainarena.io" placeholder="Nhập email...">
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label text-xs text-white-70 fw-bold">Mật khẩu</label>
            <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-white-50"><i class="bi bi-lock"></i></span>
                <input type="password" id="input-password" class="form-control bg-dark border-secondary text-white" value="••••••••" placeholder="Nhập mật khẩu...">
            </div>
        </div>

        <div class="d-grid gap-2 mb-4">
            <!-- CTA: Login with Email -->
            <button type="button" id="btn-login-email" class="btn btn-cyan btn-lg text-sm fw-bold">
                <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập bằng Email
            </button>

            <!-- CTA: Login with Google -->
            <button type="button" id="btn-login-google" class="btn btn-glass d-flex align-items-center justify-content-center gap-2 text-sm fw-bold">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Đăng nhập với Google</span>
            </button>
        </div>

        <div class="position-relative text-center my-3">
            <hr class="border-secondary border-opacity-25 my-0">
            <span class="position-absolute top-50 start-50 translate-middle bg-dark-card px-2 text-xxs text-white-50">HOẶC</span>
        </div>

        <!-- Guest Mode per OQ-01 / ASSUMPTION -->
        <div class="text-center">
            <button type="button" id="btn-login-guest" class="btn btn-link text-white-50 text-xs text-decoration-none hover-white">
                <i class="bi bi-person-badge me-1"></i> Chơi thử dạng Khách (Guest Mode)
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/mock-data.js"></script>
    <script src="../js/app.js"></script>
    <script>
        function doLogin(loginType) {
            localStorage.setItem('brainarena_is_logged_in', 'true');
            localStorage.setItem('brainarena_login_type', loginType);
            
            // Ensure default player state is ready
            AppState.getPlayer();
            SFX.correct();
            
            showToast("Đăng nhập thành công!", `Chào mừng bạn quay lại đấu trường BrainArena (${loginType}).`, "success");
            setTimeout(() => {
                window.location.href = 'home.html';
            }, 600);
        }

        document.getElementById('btn-login-email').addEventListener('click', () => doLogin('Email'));
        document.getElementById('btn-login-google').addEventListener('click', () => doLogin('Google'));
        document.getElementById('btn-login-guest').addEventListener('click', () => doLogin('Khách'));
    </script>
</body>
</html>
