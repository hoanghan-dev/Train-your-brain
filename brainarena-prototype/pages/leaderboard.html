<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Xếp Hạng — BrainArena</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- App CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="bg-main text-white">
    <!-- US-10: Bảng xếp hạng thành tích và vinh danh tuần -->
    <div class="app-layout">
        <div id="global-header-placeholder"></div>

        <div class="app-body">
            <div id="desktop-sidebar-placeholder"></div>

            <main class="main-viewport">
                <div class="content-container">
                    <!-- Title Banner -->
                    <div class="card-esports p-4 mb-4 border-primary border-opacity-30 shadow-neon">
                        <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3">
                            <div>
                                <span class="badge bg-danger-subtle text-rose border border-danger border-opacity-25 text-xxs px-2 py-1 mb-2">
                                    MÙA GIẢI 1 (SEASON 1)
                                </span>
                                <h4 class="mb-1 fw-bold d-flex align-items-center gap-2">
                                    <i class="bi bi-trophy-fill text-amber"></i>
                                    Bảng Xếp Hạng Trí Tuệ (Leaderboard)
                                </h4>
                                <p class="text-xs text-white-50 mb-0">
                                    Vinh danh các bộ não nhanh nhạy nhất tuần. Top 10 nhận huy hiệu danh dự độc quyền!
                                </p>
                            </div>

                            <div class="text-sm-end">
                                <span class="text-xxs text-white-50 text-uppercase fw-bold">KẾT THÚC TUẦN SAU:</span>
                                <div class="text-sm fw-bold text-cyan mt-1">
                                    <i class="bi bi-clock-history me-1"></i>3 ngày 14 giờ
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Tabs: Schulte vs Stroop (US-10) -->
                    <div class="d-flex gap-2 mb-3">
                        <button type="button" id="tab-leaderboard-schulte" class="btn btn-cyan btn-sm fw-bold px-3">
                            <i class="bi bi-grid-3x3 me-1"></i> Bảng Schulte (Thời gian)
                        </button>
                        <button type="button" id="tab-leaderboard-stroop" class="btn btn-glass btn-sm fw-bold px-3">
                            <i class="bi bi-palette2 me-1"></i> Thử Thách Stroop (Điểm số)
                        </button>
                    </div>

                    <!-- Top 3 Podium Preview -->
                    <div class="row g-3 mb-4">
                        <div class="col-4">
                            <div class="card-esports p-3 text-center border-secondary border-opacity-50">
                                <span class="badge bg-secondary text-white text-xxs mb-1">#2 BẠC</span>
                                <div class="avatar-ring-sm mx-auto mb-1 fs-5">⚡</div>
                                <div class="text-xs fw-bold text-truncate text-white">QuantumMind</div>
                                <span class="text-xxs text-cyan">9.8s</span>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="card-esports p-3 text-center border-warning shadow-neon" style="transform: translateY(-6px);">
                                <span class="badge bg-warning text-dark text-xxs mb-1">👑 #1 VÀNG</span>
                                <div class="avatar-ring-sm mx-auto mb-1 fs-5 border-warning">👑</div>
                                <div class="text-xs fw-bold text-truncate text-white">HyperFocus</div>
                                <span class="text-xxs text-amber fw-bold">8.4s</span>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="card-esports p-3 text-center border-amber border-opacity-50">
                                <span class="badge bg-dark border border-secondary text-white-50 text-xxs mb-1">#3 ĐỒNG</span>
                                <div class="avatar-ring-sm mx-auto mb-1 fs-5">🎯</div>
                                <div class="text-xs fw-bold text-truncate text-white">SynapseGod</div>
                                <span class="text-xxs text-cyan">10.2s</span>
                            </div>
                        </div>
                    </div>

                    <!-- Leaderboard Table List -->
                    <div class="card-esports p-3">
                        <div class="d-flex justify-content-between align-items-center text-xxs text-white-50 px-3 pb-2 border-bottom border-secondary border-opacity-25">
                            <span>HẠNG & NGƯỜI CHƠI</span>
                            <span>THÀNH TÍCH TỐT NHẤT</span>
                        </div>
                        <div id="leaderboard-list">
                            <!-- Populated by leaderboard.js -->
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <div id="mobile-bottom-nav-placeholder"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/leaderboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            LeaderboardManager.init();
        });
    </script>
</body>
</html>
