<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Huy Hiệu (Rewards) — BrainArena</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- App CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="bg-main text-white">
    <!-- US-09: Tích lũy Brain Points và đổi Huy hiệu Danh dự -->
    <div class="app-layout">
        <div id="global-header-placeholder"></div>

        <div class="app-body">
            <div id="desktop-sidebar-placeholder"></div>

            <main class="main-viewport">
                <div class="content-container">
                    <!-- Title and Points Display -->
                    <div class="card-esports p-4 mb-4 border-primary border-opacity-30 shadow-neon">
                        <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3">
                            <div>
                                <span class="badge bg-warning-subtle text-amber border border-warning border-opacity-25 text-xxs px-2 py-1 mb-2">
                                    VẬT PHẨM DANH DỰ
                                </span>
                                <h4 class="mb-1 fw-bold d-flex align-items-center gap-2">
                                    <i class="bi bi-award-fill text-amber"></i>
                                    Kho Phần Thưởng & Huy Hiệu
                                </h4>
                                <p class="text-xs text-white-50 mb-0">
                                    Sử dụng Brain Points tích lũy từ các trận đấu để đổi huy hiệu độc quyền và trưng bày trên hồ sơ.
                                </p>
                            </div>

                            <!-- User Points Counter -->
                            <div class="bg-dark p-3 rounded-3 border border-secondary border-opacity-50 text-sm-end">
                                <span class="text-xxs text-white-50 text-uppercase fw-bold">SỐ DƯ ĐIỂM BRAIN POINTS:</span>
                                <div class="d-flex align-items-center justify-content-sm-end gap-2 mt-1">
                                    <i class="bi bi-gem text-amber fs-4"></i>
                                    <span class="fs-3 fw-bold text-amber" id="user-points-display">1,250</span>
                                    <span class="text-xs text-white-50">BP</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Badges Grid -->
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <h6 class="fw-bold mb-0 text-white d-flex align-items-center gap-2">
                            <i class="bi bi-shield-shaded text-cyan"></i>
                            Bộ Sưu Tập Huy Hiệu (6 Vật Phẩm MVP)
                        </h6>
                        <span class="text-xxs text-white-50">Huy hiệu thể hiện đẳng cấp trên bảng xếp hạng</span>
                    </div>

                    <!-- Cards Container -->
                    <div class="row g-3" id="badges-grid-container">
                        <!-- Populated by rewards.js -->
                    </div>
                </div>
            </main>
        </div>

        <div id="mobile-bottom-nav-placeholder"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/rewards.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            RewardsManager.renderBadgeStore();
        });
    </script>
</body>
</html>
