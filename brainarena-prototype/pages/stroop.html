<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thử Thách Stroop — BrainArena</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- App CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="bg-main text-white">
    <!-- US-03: Luyện tập Thử thách Stroop theo cấp độ tăng dần -->
    <div class="app-layout">
        <div id="global-header-placeholder"></div>

        <div class="app-body">
            <div id="desktop-sidebar-placeholder"></div>

            <main class="main-viewport">
                <div class="content-container">
                    <!-- Top Game Bar -->
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <div class="d-flex align-items-center gap-2">
                            <a href="challenges.html" class="btn btn-sm btn-icon-glass" title="Quay lại"><i class="bi bi-arrow-left"></i></a>
                            <div>
                                <h5 class="mb-0 fw-bold">Thử Thách Stroop</h5>
                                <span class="badge bg-danger text-xxs" id="game-level-indicator">Level 1</span>
                            </div>
                        </div>

                        <!-- Question Countdown Display -->
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-stopwatch text-pink fs-5"></i>
                            <span class="timer-badge" id="stroop-timer-text">3.5s</span>
                        </div>
                    </div>

                    <!-- Question Countdown Bar -->
                    <div class="progress-esports mb-3">
                        <div id="stroop-timer-bar" class="progress-bar progress-bar-cyan" style="width: 100%;"></div>
                    </div>

                    <!-- Stroop HUD Bar -->
                    <div class="stat-card mb-3 d-flex align-items-center justify-content-around text-center">
                        <div>
                            <span class="text-xxs text-white-50 text-uppercase fw-bold">Câu hỏi</span>
                            <div class="fs-5 fw-bold text-white" id="stroop-count">1/10</div>
                        </div>

                        <div class="border-start border-end border-secondary border-opacity-25 px-3">
                            <span class="text-xxs text-white-50 text-uppercase fw-bold">Điểm số</span>
                            <div class="fs-5 fw-bold text-pink" id="stroop-score">0</div>
                        </div>

                        <div>
                            <span class="text-xxs text-white-50 text-uppercase fw-bold">Chuỗi đúng (Streak)</span>
                            <div class="fs-5 fw-bold text-cyan" id="stroop-streak">0 🔥</div>
                        </div>
                    </div>

                    <!-- Stroop Word Display Area -->
                    <div class="stroop-card mb-4">
                        <span class="badge bg-dark border border-secondary text-xxs text-white-70 px-3 py-1 mb-2">
                            CHỌN MÀU MỰC THỰC TẾ (KHÔNG ĐỌC TỪ)
                        </span>

                        <div id="stroop-word" class="stroop-word">
                            ĐỎ
                        </div>

                        <div id="stroop-feedback" class="badge bg-dark text-white-50 p-2 text-xs">
                            Hãy sẵn sàng bấm màu tương ứng bên dưới
                        </div>
                    </div>

                    <!-- Color Buttons Area (Grid of 4-5 buttons) -->
                    <div id="stroop-buttons" class="stroop-buttons-grid">
                        <!-- Rendered by stroop.js -->
                    </div>
                </div>
            </main>
        </div>

        <div id="mobile-bottom-nav-placeholder"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/stroop.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const level = parseInt(urlParams.get('level')) || 1;

            const indicator = document.getElementById('game-level-indicator');
            if (indicator) {
                indicator.textContent = `Level ${level} (${level === 1 ? '10 câu' : level === 2 ? '15 câu' : '20 câu'})`;
            }

            window.currentStroopGame = new StroopGame();
            window.currentStroopGame.init(level);
        });
    </script>
</body>
</html>
